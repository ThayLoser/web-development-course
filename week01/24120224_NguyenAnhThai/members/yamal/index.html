<!DOCTYPE html>

<head>

    <title>Thông tin thành viên - Lamine Yamal</title>
    <style type="text/css">
        body {
            background-color: rgb(255, 203, 197);
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .card {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #333;
        }

        .info {
            text-align: left;
            margin-top: 20px;
            line-height: 1.8;
            font-size: 16px;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            transition: 0.3s;
        }

        a:hover {
            background: #555;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="images/yamal.png" alt="Hình đại diện">
