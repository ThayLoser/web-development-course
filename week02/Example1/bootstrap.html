<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Responsive</title>
    <!-- Include Bootstrap CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom colors matching the image */
        .bg-header { background-color: #6495ED; }
        .bg-side { background-color: #F4D03F; }
        .bg-content { background-color: #A9DFBF; }
        .bg-footer { background-color: #E59866; }
    </style>
</head>
<body class="min-vh-100 d-flex flex-column m-0">
    <div class="container-fluid p-0 d-flex flex-column flex-grow-1">
        <!-- Header -->
        <div class="row m-0">
            <div class="col-12 p-4 fw-bold bg-header">HEADER</div>
        </div>
        
        <!-- Main Content Area -->
        <div class="row m-0 flex-grow-1">
            <!-- Side: takes full width on small screens (col-12) and 4 columns on medium/large (col-md-4) -->
            <div class="col-12 col-md-4 p-4 fw-bold bg-side">SIDE</div>
            <!-- Content: takes full width on small screens (col-12) and 8 columns on medium/large (col-md-8) -->
            <div class="col-12 col-md-8 p-4 fw-bold bg-content">CONTENT</div>
        </div>
        
        <!-- Footer -->
        <div class="row m-0">
            <div class="col-12 p-4 fw-bold bg-footer">FOOTER</div>
        </div>
    </div>

    <!-- Include Bootstrap JS from CDN (Optional for this layout but good practice) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
