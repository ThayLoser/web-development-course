<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TailwindCSS Responsive</title>
    <!-- Include TailwindCSS from CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col font-sans m-0">
    <!-- Header -->
    <header class="bg-[#6495ED] p-5 font-bold">HEADER</header>
    
    <!-- Main Content Area: Column by default (mobile), Row on medium screens (md:flex-row) -->
    <main class="flex flex-col md:flex-row flex-1">
        <!-- Side: Takes full width on mobile, 33.3% on medium screens (md:w-1/3) -->
        <aside class="bg-[#F4D03F] p-5 font-bold md:w-1/3">SIDE</aside>
        
        <!-- Content: Takes remaining space -->
        <section class="bg-[#A9DFBF] p-5 font-bold flex-1">CONTENT</section>
    </main>
    
    <!-- Footer -->
    <footer class="bg-[#E59866] p-5 font-bold">FOOTER</footer>
</body>
</html>
