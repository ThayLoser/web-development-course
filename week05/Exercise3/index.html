    // Fallback hiển thị icon danh mục khi ảnh p*.png không tải được
    function FallbackImage({ category }) {
      return (
        <div className="w-full h-full flex items-center justify-center bg-slate-50 text-slate-400">
          <svg className="w-16 h-16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </div>
      );
    }

    // Component ảnh có cơ chế fallback
    function ProductImage({ id, category, title, className = "h-44" }) {
      const [imgFailed, setImgFailed] = useState(false);

      if (imgFailed) {
        return (
          <div className={`${className} w-full flex items-center justify-center p-2`}>
            <FallbackImage category={category} />
          </div>
        );
      }

      return (
        <div className={`${className} w-full flex items-center justify-center p-2`}>
          <img
            src={`imgs/p${id}.png`}
            alt={title}
            onError={() => setImgFailed(true)}
            className="max-h-full max-w-full object-contain"
          />
        </div>
      );
    }

    function App() {
      const [products, setProducts] = useState(EMBEDDED_DATA);
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [detailProduct, setDetailProduct] = useState(null);

      // Thử nạp động từ file data.js nếu có server hỗ trợ module
      useEffect(() => {
        import('./data.js')
          .then(mod => {
            if (mod && mod.default) setProducts(mod.default);
          })
          .catch(() => {});
      }, []);

      const categories = ['men\'s clothing', 'jewelery', 'electronics', 'women\'s clothing'];

      const displayedProducts = useMemo(() => {
        if (selectedCategory === 'ALL') return products;
        return products.filter(p => p.category.toLowerCase() === selectedCategory.toLowerCase());
      }, [products, selectedCategory]);

      const handleGoHome = (e) => {
        if (e) e.preventDefault();
        setSelectedCategory('ALL');
        setDetailProduct(null);
      };

      return (
        <div className="bg-white border border-[#ccc] rounded shadow-md overflow-hidden flex flex-col">
          {/* Header khớp Slide 3 & 4 */}
          <header className="bg-[#e2f1fc] px-6 py-3 flex items-center justify-between border-b border-blue-200">
            <button
              onClick={handleGoHome}
              className="font-bold text-slate-800 hover:text-blue-600 focus:outline-none"
            >
              Home
            </button>
            <div className="flex items-center gap-6 text-sm text-blue-500">
              <a href="#about" onClick={(e) => e.preventDefault()} className="hover:underline">About</a>
              <a href="#services" onClick={(e) => e.preventDefault()} className="hover:underline">Services</a>
              <a href="#contact" onClick={(e) => e.preventDefault()} className="hover:underline">Contact</a>
            </div>
          </header>

          {/* Phần nội dung: Sidebar trái + Main area */}
          <div className="flex flex-col md:flex-row min-h-[500px]">
            {/* Sidebar bên trái nền vàng nhạt khớp ảnh mẫu */}
            <aside className="w-full md:w-48 bg-[#fbf2cf] p-5 flex-shrink-0">
              <nav className="flex flex-col space-y-3">
                {categories.map((cat) => (
                  <button
                    key={cat}
                    onClick={() => {
                      setSelectedCategory(cat);
                      setDetailProduct(null);
                    }}
                    className={`text-left text-xs sm:text-sm font-medium transition-colors ${
                      selectedCategory === cat ? 'text-blue-700 font-bold underline' : 'text-blue-500 hover:underline'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </nav>
            </aside>

            {/* Vùng hiển thị chính */}
            <main className="flex-1 p-6 bg-white">
              {detailProduct ? (
                /* Chi tiết sản phẩm khớp Slide 4 */
                <div className="bg-[#e4eefb]/50 p-8 rounded-lg flex flex-col md:flex-row gap-8 items-center">
                  <div className="w-full md:w-1/2 flex items-center justify-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <ProductImage
                      id={detailProduct.id}
                      category={detailProduct.category}
                      title={detailProduct.title}
                      className="h-64 sm:h-80"
                    />
                  </div>

                  <div className="w-full md:w-1/2 flex flex-col justify-center">
                    <h1 className="text-2xl font-bold text-slate-800 mb-3">
                      {detailProduct.title}
                    </h1>
                    <p className="text-xs text-slate-600 leading-relaxed mb-6">
                      {detailProduct.description}
                    </p>
                    <div className="text-xl font-bold text-slate-900 mb-6">
                      Price: ${detailProduct.price}
                    </div>
                    <div>
                      <button 
                        onClick={() => alert(`Đã thêm ${detailProduct.title} vào giỏ hàng!`)}
                        className="px-5 py-2 bg-[#428b46] hover:bg-[#38783c] text-white font-semibold rounded text-xs transition-colors shadow"
                      >
                        Add to Cart
                      </button>
                    </div>
                  </div>
                </div>
              ) : (
                /* Danh sách sản phẩm khớp Slide 3 */
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                  {displayedProducts.map((product) => (
                    <div
                      key={product.id}
                      className="border border-[#e2e8f0] p-4 rounded flex flex-col justify-between shadow-sm hover:shadow transition-shadow bg-white"
                    >
                      <ProductImage
                        id={product.id}
                        category={product.category}
                        title={product.title}
                        className="h-44"
                      />

                      <div className="mt-2 flex-1 flex flex-col">
                        <h3 className="font-bold text-slate-800 text-xs mb-1 line-clamp-2" title={product.title}>
                          {product.title}
                        </h3>
                        <p className="text-[11px] text-slate-500 line-clamp-2 mb-3">
                          {product.description}
                        </p>
                      </div>

                      <div className="pt-2 text-center">
                        <button
                          onClick={() => setDetailProduct(product)}
                          className="px-3.5 py-1 bg-[#3b82f6] hover:bg-blue-600 text-white rounded text-xs font-medium transition-colors shadow-sm"
                        >
                          Xem chi tiết
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          </div>

          {/* Footer khớp Slide 4 */}
          <footer className="bg-[#d5dbe4] py-2 text-center text-xs text-slate-600 font-medium">
            Footer content goes here
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
